name: Verify SmartTrack
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: smarttrack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:localtest@localhost:5432/smarttrack_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:localtest@localhost:5432/smarttrack_test
      PGPASSWORD: localtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements.txt
      - run: psql -h localhost -U postgres -d smarttrack_test -v ON_ERROR_STOP=1 -f backend/tests/auth_stub.sql
      - run: python -m alembic upgrade head && python -m pytest -q
        working-directory: backend
      - run: npm ci && npm test && npm run build
        working-directory: frontend
